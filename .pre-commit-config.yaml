# So a plain `pre-commit install` wires up the pre-push guard below too.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: bd-export-drift
        name: .beads/issues.jsonl matches the beads database
        # At pre-push, not pre-commit. The race this guards against happens
        # inside the pre-commit window -- the framework stashes unstaged
        # changes while beads' own hook rewrites the export -- so a check
        # running there would be racing too.
        stages: [pre-push]
        entry: python3 scripts/check_bd_export_drift.py
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/hukkin/mdformat
    rev: 0.7.21
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm
        # Two separate reasons, both load-bearing.
        #
        # .beads/, .agents/ and CLAUDE.md are files we do not own -- bd rewrites
        # them, so formatting them just churns against the next bd run. It is an
        # exclude rather than a preference because mdformat has no front-matter
        # support configured and rewrites .agents/skills/beads/SKILL.md's YAML
        # header into a thematic break plus a heading, breaking the skill.
        #
        # tests/fixtures/ is markdown in stencil's own dialect, and mdformat
        # corrupts it three ways: front matter as above, `---` slide separators
        # into `______`, and -- worst, because it is invisible -- LaTeX escaped
        # to `\\lambda` and `\\frac`. Formatting a fixture would silently change
        # what the test renders. Do not format course content with mdformat.
        exclude: ^(\.beads/|\.agents/|CLAUDE\.md$|tests/fixtures/)
