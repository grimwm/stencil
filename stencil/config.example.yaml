# Example configuration for stencil.
#
# stencil is a scaffolding generator, not a renderer. It renders Jinja2
# templates into per-package output directories; the Makefile and
# docker-compose.yml it emits are what actually run pandoc.
#
# Usage:
#   stencil list              # list packages
#   stencil gen hs6           # generate hs6
#   stencil gen hs6 --dry-run # preview without writing
#   stencil gen --all         # every package in the config
#   stencil clean hs6         # remove what stencil generated
#   stencil install           # refresh the managed .gitignore section
#
# Every command reads .config.yaml from the working directory unless you pass
# --config.

# --- Template search paths ---
#
# Where to find Jinja2 template files. Paths are relative to this config file.
# Each templates_dir is searched in order, then stencil's own bundled
# templates; first match wins. That is how a project overrides a single
# bundled template without vendoring the whole set.
#
# Can be a single path:
#   templates_dir: templates
# or a list of paths searched in order, like -I include dirs:
#   templates_dir:
#     - ./local-overrides
#     - ../shared/templates
templates_dir: templates

# --- Output directory ---
#
# Base directory for generated output. Relative paths are relative to the
# current working directory (not this config file). Absolute paths are used
# as-is. If omitted, defaults to CWD.
output_dir: ../assignments

# --- Templates ---
#
# Jinja2 templates to render into each package's output directory.
#
# Fields:
#   src:  Template filename to look up on the search path (required)
#   dest: Output filename (optional; defaults to src with the .j2 suffix removed)
#   when: A context variable name, or list of names, that must all be truthy
#         for this template to be rendered (optional). Available context
#         variables derived from each package's config include:
#           has_docs     - true if docs list is non-empty
#           has_slides   - true if slides list is non-empty
#           has_pages    - true if either docs or slides is non-empty
#           has_web      - true if "web" is in services
#           has_mysql    - true if "mysql" is in services
#           has_services - true if any services are defined
#         Keys from a package's template_env are merged into the same context,
#         so they work as `when` conditions too.
#
# Packages that render markdown do not list the pandoc HTML templates, the Lua
# filters, or the PDF driver here. stencil injects them automatically whenever
# docs or slides is non-empty, so a config cannot forget one.
templates:
  - src: Makefile.j2
  - src: docker-compose.yml.j2

  # Templates stencil does not bundle come from your own templates_dir. A
  # project that adds web or database services typically supplies its own,
  # gated on the derived service flags:
  #
  # - src: Dockerfile.j2
  #   when: has_web
  # - src: nginx.conf.j2
  #   when: has_web
  # - src: .sqlfluff.j2
  #   when: has_mysql

# --- Packages ---
#
# Each key is a package ID (e.g., "hs6") passed as a positional argument to
# stencil gen. Templates are rendered with a context built from these fields.
#
# Required:
#   package_type:   "doc", "zip", or "none"
#                     doc:  documents only; no submission archive
#                     zip:  pkg archives package_sources into package_name
#                     none: neither
#   package_name:   Submission filename, required for zip type (e.g., hs3.zip)
#
# Optional:
#   docs:           List of markdown files to convert to individual HTML
#                   documents. Each file produces HTML with the same basename
#                   (e.g., Session1.md -> Session1.html).
#   slides:         List of markdown files to convert to HTML slide decks. Same
#                   pipeline as docs, rendered with slide-template.html and split
#                   into slides at each heading of the slide level (default: ##).
#                   A markdown file belongs to docs or slides, never both.
#
#                   PDFs need no configuration. Any package with docs or slides
#                   also gets a `make pdf` target that prints the HTML it just
#                   built to a PDF of the same name; it simply goes unused if
#                   you never call it.
#   name:           Display name shown by 'stencil list' (defaults to package ID)
#   dir:            Output subdirectory under output_dir (defaults to package ID)
#   services:       List of Docker Compose services the package needs. Supported:
#                     - web:   nginx reverse proxy + php-fpm, HTML/PHP linting
#                     - mysql: MySQL database, SQL linting with sqlfluff
#                   These set has_web / has_mysql / has_services; the templates
#                   that act on them are project-supplied, not bundled.
#   package_sources: What `pkg` puts into package_name (zip default: [htdocs]).
#                   A list, resolved by one rule for every package type:
#                     md/*.md   a glob -- expands in sorted order
#                     md        a directory -- everything in it
#                     intro.md  anything else -- as written, in the listed order
#                   Nothing is filtered by extension and nothing is inferred
#                   from a name: for just the markdown in a folder, say md/*.md.
#                   A zip archives these paths; a doc concatenates them through
#                   one pandoc run into <stem>.html, then prints that to
#                   <stem>.pdf. Examples: [htdocs], [htdocs, db], [md/*.md]
#   sql_import:     Generates make targets to import SQL files into MySQL. One
#                   dict or a list of dicts:
#                     target:   make target name (e.g., import-world)
#                     database: MySQL database name to create/import into
#                     file:     path to the SQL file relative to the package dir
#   template_env:   Extra variables merged into the template context. Use these
#                   for anything your own templates need that stencil does not
#                   derive on its own.
packages:
  workspace:
    name: Workspace
    package_type: zip
    package_name: workspace.zip
    docs: [README.md]
    services:
      - web
      - mysql
