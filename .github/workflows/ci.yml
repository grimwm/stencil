name: CI

on:
  push:
    branches: [main]
  pull_request:

# This repository is public and `pull_request` builds a fork's code, so the
# token every job gets is the one a malicious PR would be handed. Nothing here
# writes: the jobs run pytest and pre-commit and report through the checks API.
# Declared at the top level so a job added later inherits read-only rather than
# whatever the repository default happens to be that year.
permissions:
  contents: read

# A force-push should not leave the previous run burning a runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The tier that needs nothing installed: the pandoc argv ordering constraints
  # and the rendered-template assertions. Fast enough to run everywhere, so it
  # runs on every interpreter the package claims to support.
  test:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -e '.[dev]'

      - run: pytest -m 'not integration' -v

  # The container-backed tier. Runs the whole suite rather than filtering to
  # -m integration, because pytest exits 5 on an empty selection and the
  # unmarked tests cost milliseconds next to a pandoc pull.
  integration:
    name: pytest (containers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e '.[dev]'

      # Pull ahead of the suite so a registry hiccup reads as a registry
      # problem rather than as a failing assertion inside a test. Asks the
      # package which image it builds with, so bumping the pin is one edit.
      - name: Pull the pandoc image
        run: |
          docker pull "$(python -c 'from stencil import pipeline; print(pipeline.PANDOC_IMAGE)')"

      # Same reasoning, one layer down: the browser image is BUILT during the
      # suite, and its FROM is the first thing that build reaches the registry
      # for. Pulled here so a registry hiccup fails as a pull rather than as
      # `could not build the browser image` with a network error buried in it.
      - name: Pull the browser image's base
        run: |
          docker pull "$(python -c 'from stencil import pipeline; print(pipeline.NODE_IMAGE)')"

      # The container tier SKIPS what it cannot find, which is right for a
      # contributor and wrong here: a runner without the compose plugin would
      # quietly stop running the check-access service tests and report green.
      # The same failure mode as a pre-push hook gated on `command -v`.
      - name: Fail if the runner has no compose implementation
        run: |
          python - <<'EOF'
          import sys
          from stencil import pipeline
          command = pipeline.compose_command()
          if command is None:
              sys.exit(
                  "no compose implementation on this runner; the compose "
                  "service tests would skip and CI would report green"
              )
          print("compose:", " ".join(command))
          EOF

      # `--dist loadfile`, not xdist's default `load`. Nine test files carry
      # module- or file-scoped fixtures that each pay one container run to
      # answer many assertions -- `accessibility` in test_check_access.py at
      # 44s, `installed` in test_pins.py, and the module-scoped fixtures in
      # test_pdf_ua, test_pdf, test_columns, test_painted_gaps and
      # test_download. Under `load` a file's tests scatter across workers and
      # each worker rebuilds that fixture, up to four times: a regression
      # dressed as parallelism. `loadfile` sends a file to one worker, so every
      # one of those is built exactly once, precisely as it is today.
      #
      # Here rather than in [tool.pytest.ini_options] addopts on purpose. In
      # addopts it would change what plain `pytest` does for every contributor
      # and break `-x` and `--pdb` by default. Not because the fast tier has
      # nothing to gain -- measured, it goes 18.18s -> 5.24s under these same
      # flags -- but because a predictable plain `pytest` is worth more than
      # 13 seconds, and anyone who wants them can pass them.
      # The risk of a CI-only flag --
      # a code path exercised only in CI can silently stop working -- is
      # answered by tests/test_parallel_harness.py, which pins the two harness
      # behaviours this depends on in the fast tier.
      - run: pytest -v -n auto --dist loadfile

  lint:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: pre-commit/action@v3.0.1
