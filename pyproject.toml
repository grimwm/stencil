[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stencil"
# Read from stencil/__init__.py so there is one place to bump. See
# AGENTS.md#cutting-a-release.
dynamic = ["version"]
description = "Generate project scaffolding from Jinja2 templates and YAML config"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest>=8.0",
    # Structural assertions on rendered pages. The deck reference-list test
    # needs a real ancestor chain, not a substring match.
    "beautifulsoup4>=4.12",
    # Page geometry and text extraction from the generated PDFs.
    "pypdf>=4.0",
]

[project.scripts]
stencil = "stencil.generate:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a container runtime; deselect with -m 'not integration'",
]

[tool.setuptools.dynamic]
version = {attr = "stencil.__version__"}

[tool.setuptools.package-data]
stencil = [
    "config.example.yaml",
    "templates/*",
    "templates/.*",
    "assets/*",
]
