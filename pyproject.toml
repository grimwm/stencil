[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stencil"
# Read from stencil/__init__.py so there is one place to bump. See
# AGENTS.md#cutting-a-release.
dynamic = ["version"]
description = "Generate project scaffolding from Jinja2 templates and YAML config"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest>=8.0",
    # Structural assertions on rendered pages. The deck reference-list test
    # needs a real ancestor chain, not a substring match.
    "beautifulsoup4>=4.12",
    # Page geometry and text extraction from the generated PDFs. Bounded above
    # since 0.13.0: tests/test_pdf.py now asserts on extracted *text*, and
    # pypdf's space and line-break insertion is a layout heuristic that has
    # changed materially across majors. An upper bound makes that a deliberate
    # upgrade with a test run behind it rather than a silent change in what the
    # accessibility guards are sensitive to.
    "pypdf>=4.0,<7",
    # The container tier runs under `-n auto --dist loadfile` in CI (stn-vda).
    # `filelock` is what serializes the browser-image build across workers, and
    # it is declared here rather than leaned on: it already arrives
    # transitively through pre-commit -> virtualenv, and depending on something
    # by accident is how a transitive dependency becomes a breakage.
    #
    # Neither is pinned. These are test-harness tooling, not the supply chain
    # `stencil/pipeline.py` governs -- tests/test_pins.py is about what a
    # GENERATED PACKAGE installs, and nothing here reaches one.
    "pytest-xdist",
    "filelock",
]

[project.scripts]
stencil = "stencil.generate:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

# The repository ROOT on sys.path, so `import stencil` finds the tree whose
# tests are running (stn-2et).
#
# pytest's default `prepend` import mode inserts the first directory ABOVE a
# test file that has no `__init__.py`. `tests/` has none, so what lands on
# sys.path is `<checkout>/tests` and never `<checkout>` itself -- and `import
# stencil` fell through to whatever `pip install -e .` had registered, which
# is ONE checkout by absolute path. AGENTS.md tells everyone to work in a git
# worktree, so the documented arrangement is several trees sharing one
# install, and a worktree's suite silently graded the other tree's source.
#
# Measured, from a worktree using the main checkout's venv: without this the
# console script imports `<main>/stencil/__init__.py`; with it, the
# worktree's. `python -m pytest` was right all along because `-m` puts the cwd
# on sys.path first, which is why the obvious sanity check never caught it.
#
# Resolved relative to ROOTDIR, not the cwd -- verified by running from
# `<checkout>/tests` and from an unrelated directory with an absolute target.
# Applied from `pytest_load_initial_conftests(tryfirst=True)`, so it is in
# place before tests/conftest.py is imported, which is what makes it
# sufficient given that conftest imports stencil at module scope. It reaches
# xdist workers. tests/conftest.py carries the guard that says so when any of
# that stops being true.
#
# THE COST, accepted rather than discovered later. The root now precedes
# site-packages for every pytest run, where before only `tests/` did. A file
# named `yaml.py` or `filelock.py` at the TOP of this tree would become the
# one the suite imports, and tests/conftest.py imports both at module scope.
# That is not a new capability -- CI builds fork pull requests, so anyone who
# can land a test file can already run code there, which is why the workflow
# grants `contents: read` and no secrets -- but it does let such a file look
# more innocuous than one inside `tests/`. Monitored rather than argued
# about: tests/test_worktree_imports.py fails if any git-tracked name at the
# root starts shadowing an installed module.
pythonpath = ["."]
markers = [
    "integration: needs a container runtime; deselect with -m 'not integration'",
]

# A passing test's output is deleted as it goes; a failing test's is kept.
#
# stn-7im, measured: a full run exhausted a 7.7GB tmpfs /tmp, and it did not
# look like a disk failure -- two runs reported a bare exit 1, and the harness
# capturing their output hit ENOSPC of its own. The arithmetic is that each
# generated package is about 10.75MB, nearly all of it the Bootstrap,
# highlight.js, Mermaid and fonts inlined into html-template.html; the unit
# tier alone generates a few hundred; and pytest's default keeps the last
# three runs of all of it.
#
# The trade, stated because it is a real one: a test that PASSED no longer
# leaves its generated package to poke at afterwards. When that is what you
# want -- and for this repository it often is, since reading a generated
# Makefile is how several of these bugs were found -- ask for it explicitly:
#
#     pytest -o tmp_path_retention_policy=all
#
# tmp_path_retention_count is deliberately left alone. With this policy the
# per-run directories are near-empty, so the count is no longer the lever.
tmp_path_retention_policy = "failed"

# Named rather than discovered. With plugin/ beside stencil/ at the top level,
# setuptools' flat-layout discovery sees two candidate packages and refuses to
# build at all, which fails `pip install -e .` before a single test runs.
[tool.setuptools]
packages = ["stencil"]

[tool.setuptools.dynamic]
version = {attr = "stencil.__version__"}

[tool.setuptools.package-data]
stencil = [
    "config.example.yaml",
    "templates/*",
    "templates/.*",
    "assets/*",
]
